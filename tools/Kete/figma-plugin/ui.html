<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: Inter, Helvetica, sans-serif; margin: 0; padding: 16px; font-size: 12px; color: #1a1a1a; }
    p { margin: 0 0 10px; line-height: 1.4; }
    textarea { width: 100%; height: 72px; border: none; background: #f7f6f4; border-radius: 8px; padding: 8px; font: inherit; }
    button { margin-top: 8px; border: none; background: #1a1a1a; color: #fff; border-radius: 99px; height: 28px; padding: 0 12px; font: inherit; }
  </style>
</head>
<body>
  <p id="msg">Reading the kete…</p>
  <div id="fallback" style="display:none">
    <textarea id="kit" placeholder="Paste the kit JSON from Kete"></textarea>
    <button id="go">Import</button>
  </div>
  <script>
    function post(kit) {
      parent.postMessage({ pluginMessage: { type: "import", kit: kit } }, "*");
    }
    async function attach(kit) {
      for (const image of kit.images || []) {
        if (!image.url) continue;
        try {
          const response = await fetch(image.url);
          if (!response.ok) continue;
          const bytes = new Uint8Array(await response.arrayBuffer());
          if (bytes.length > 4000000) continue;
          image.bytes = Array.from(bytes);
        } catch (error) {}
      }
      return kit;
    }
    async function fromServer() {
      const response = await fetch("http://127.0.0.1:4787/api/figma/pending");
      if (!response.ok) throw new Error("Kete has not prepared a kit.");
      const kit = await response.json();
      document.getElementById("msg").textContent = "Building styles and components…";
      post(await attach(kit));
    }
    document.getElementById("go").onclick = async () => {
      try {
        const kit = JSON.parse(document.getElementById("kit").value);
        document.getElementById("msg").textContent = "Building styles and components…";
        post(await attach(kit));
      } catch (error) {
        document.getElementById("msg").textContent = "That JSON could not be read.";
      }
    };
    fromServer().catch(() => {
      document.getElementById("msg").textContent = "Kete is not reachable from Figma. Paste the kit JSON instead.";
      document.getElementById("fallback").style.display = "block";
    });
  </script>
</body>
</html>
