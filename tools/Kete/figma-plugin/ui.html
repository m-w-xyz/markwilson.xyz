<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: Inter, Helvetica, sans-serif; margin: 0; padding: 16px; font-size: 12px; color: #1a1a1a; }
    p { margin: 0 0 10px; line-height: 1.4; }
    textarea { width: 100%; height: 72px; border: none; background: #f7f6f4; border-radius: 8px; padding: 8px; font: inherit; }
    button { margin-top: 8px; margin-right: 8px; border: none; background: #1a1a1a; color: #fff; border-radius: 99px; height: 28px; padding: 0 12px; font: inherit; cursor: pointer; }
    button.quiet { background: transparent; color: #1a1a1a; }
  </style>
</head>
<body>
  <p id="msg">Reading the kete…</p>
  <div id="fonts" style="display:none">
    <button id="add-fonts">Add them</button>
    <button id="skip-fonts" class="quiet">Continue without them</button>
  </div>
  <div id="fallback" style="display:none">
    <button id="clip">Use the copied kit</button>
    <textarea id="kit" placeholder="Or paste the kit here"></textarea>
    <button id="go">Import pasted kit</button>
  </div>
  <script>
    let pendingFaces = [];
    function post(kit) {
      parent.postMessage({ pluginMessage: { type: "import", kit: kit } }, "*");
    }
    function fontChoice(choice, note) {
      document.getElementById("fonts").style.display = "none";
      document.getElementById("msg").textContent = "Building styles and components…";
      parent.postMessage({ pluginMessage: { type: "fonts", choice: choice, note: note || "" } }, "*");
    }
    function fromB64(value) {
      const bin = atob(value);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
    async function attach(kit) {
      for (const image of kit.images || []) {
        try {
          let bytes = null;
          if (image.b64) bytes = fromB64(image.b64);
          else if (image.url) {
            const response = await fetch(image.url);
            if (response.ok) bytes = new Uint8Array(await response.arrayBuffer());
          }
          if (!bytes || bytes.length > 4000000) continue;
          image.bytes = Array.from(bytes);
        } catch (error) { /* one picture can fail */ }
      }
      return kit;
    }
    async function useKit(kit) {
      document.getElementById("msg").textContent = "Building styles and components…";
      post(await attach(kit));
    }
    async function fromServer() {
      const response = await fetch("http://127.0.0.1:4787/api/figma/pending");
      if (!response.ok) throw new Error("Kete has not prepared a kit.");
      await useKit(await response.json());
    }
    async function fromClipboard() {
      const text = await navigator.clipboard.readText();
      await useKit(JSON.parse(text));
    }
    document.getElementById("clip").onclick = () => {
      fromClipboard().catch(() => {
        document.getElementById("msg").textContent = "Nothing on the clipboard could be read. Paste the kit below.";
      });
    };
    document.getElementById("go").onclick = () => {
      try { useKit(JSON.parse(document.getElementById("kit").value)); }
      catch (error) { document.getElementById("msg").textContent = "That JSON could not be read."; }
    };
    document.getElementById("add-fonts").onclick = () => {
      document.getElementById("msg").textContent = "Adding the typefaces…";
      fetch("http://127.0.0.1:4787/api/fonts/install", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ faces: pendingFaces }),
      }).then((response) => response.json()).then((data) => {
        const missing = (data.missing || []).map((item) => item.family + ". " + item.reason).join(" ");
        fontChoice("install", missing);
      }).catch(() => {
        document.getElementById("msg").textContent = "Kete isn't running on this Mac, so the typeface can't be added from here.";
      });
    };
    document.getElementById("skip-fonts").onclick = () => fontChoice("skip", "");
    window.onmessage = (event) => {
      const message = event.data && event.data.pluginMessage;
      if (!message || message.type !== "missing-fonts") return;
      pendingFaces = message.faces || [];
      const names = pendingFaces.map((face) => face.family).filter((name, index, list) => list.indexOf(name) === index);
      document.getElementById("msg").textContent = "Figma doesn't have " + names.join(", ") + ". Add " + (names.length === 1 ? "it" : "them") + " to this Mac?";
      document.getElementById("fallback").style.display = "none";
      document.getElementById("fonts").style.display = "block";
    };
    fromServer().catch(() => {
      document.getElementById("msg").textContent = "Kete is not on this computer. Use the kit it copied.";
      document.getElementById("fallback").style.display = "block";
      fromClipboard().catch(() => {});
    });
  </script>
</body>
</html>
