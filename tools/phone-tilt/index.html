        return;
      }
      const node = fillNode(spot.line);
      if (!node) {
        caret.hidden = true;
        return;
      }
      const raw = node.textContent;
      const index = raw === "\u200b" ? 0 : Math.max(0, Math.min(spot.local, raw.length));
      const range = document.createRange();
      range.setStart(node, index);
      range.collapse(true);
      const rect = range.getClientRects()[0] || spot.line.getBoundingClientRect();
      const lineRect = spot.line.getBoundingClientRect();
      const height = Math.max(18, lineRect.height * 0.72);
      const mark = editor.selectionStart + ":" + editor.selectionEnd;
      if (caret.dataset.mark !== mark) {
        caret.dataset.mark = mark;
        caret.style.animation = "none";
        void caret.offsetWidth;
        caret.style.animation = "";
      }
      caret.hidden = false;
      caret.style.height = height + "px";
      caret.style.left = rect.left + "px";
      caret.style.top = (rect.top + (lineRect.height - height) / 2) + "px";
    }

    function typeRect() {
      const rect = text.getBoundingClientRect();
      const slop = 28;
      const left = Math.max(0, rect.left - slop);
      const top = Math.max(0, rect.top - slop);
      const right = Math.min(window.innerWidth, rect.right + slop);
      const bottom = Math.min(window.innerHeight, rect.bottom + slop);
      return {
        left: left,
        top: top,
        right: right,
        bottom: bottom,
        width: Math.max(64, right - left),
        height: Math.max(64, bottom - top),
      };
    }

    function placeEditor() {
      const box = typeRect();
      editor.style.left = box.left + "px";
      editor.style.top = box.top + "px";
      editor.style.width = box.width + "px";
      editor.style.height = box.height + "px";
    }

    function placeCaretFromPoint(x, y) {
      const lines = [...text.querySelectorAll(":scope > .line")];
      if (!lines.length || text.classList.contains("placeholder")) {
        editor.selectionStart = editor.selectionEnd = 0;
        return;
      }
      let chosen = lines[0];
      let best = Infinity;
      lines.forEach((el) => {
        const rect = el.getBoundingClientRect();
        const middle = (rect.top + rect.bottom) / 2;
        const dist = y >= rect.top && y <= rect.bottom ? 0 : Math.abs(y - middle);
        if (dist < best) {
          best = dist;
          chosen = el;
        }
      });
      const node = fillNode(chosen);
      const start = Number(chosen.dataset.start);
      if (!node || node.textContent === "\u200b") {
        editor.selectionStart = editor.selectionEnd = start;
        return;
      }
      const value = node.textContent;
      const range = document.createRange();
      let at = value.length;
      let dist = Infinity;
      for (let i = 0; i <= value.length; i++) {
        range.setStart(node, i);
        range.collapse(true);
        const rect = range.getClientRects()[0];
        if (!rect) continue;
        const delta = Math.abs(rect.left - x);
        if (delta < dist) {
          dist = delta;
          at = i;
        }
      }
      editor.selectionStart = editor.selectionEnd = start + at;
    }

    function overText(x, y) {
      const box = typeRect();
      return x >= box.left && x <= box.right && y >= box.top && y <= box.bottom;
    }

    function fit() {
      const editing = sourceText.length > 0;
      const sample = editing ? sourceText : "Type a sentence";
      const safe = readSafe();
      const viewport = window.visualViewport;
      const edge = 8;
      const originLeft = (viewport ? viewport.offsetLeft : 0) + safe.left + edge;
      const originTop = (viewport ? viewport.offsetTop : 0) + safe.top + edge;
      const viewW = Math.max(48, (viewport ? viewport.width : window.innerWidth) - safe.left - safe.right - edge * 2);
      const viewH = Math.max(48, (viewport ? viewport.height : window.innerHeight) - safe.top - safe.bottom - edge * 2);
      const key = [
        sample,
        useAreal ? "areal" : "exposure",
        String(mode % 3),
        Math.round(currentExpo),
        Math.round(currentSlant),
        Math.round(viewW),
        Math.round(viewH),
      ].join(":");
      if (key === fittedKey) return;
      fittedKey = key;

      const firstExpo = useAreal ? currentExpo : heaviestExpo(1);
      let laid = measureBlock(sample, firstExpo, viewW, viewH);
      if (laid.lines.length > 1) {
        const heavy = useAreal ? Math.min(currentExpo, -currentExpo) : heaviestExpo(laid.lines.length);
        if (Math.abs(heavy - firstExpo) > 0.5) laid = measureBlock(sample, heavy, viewW, viewH);
      }
      text.style.position = "absolute";
      text.style.boxSizing = "border-box";
      text.style.whiteSpace = "pre";
      text.style.setProperty("overflow", "visible", "important");
      text.style.fontSize = laid.size + "px";
      text.style.lineHeight = laid.lineHeight;
      text.style.width = viewW + "px";
      text.style.paddingLeft = laid.pad[0] + "px";
      text.style.paddingRight = laid.pad[1] + "px";
      text.style.left = originLeft + "px";
      renderLines(laid.lines, !editing);
      applyFace();
      const inkH = Math.max(1, text.offsetHeight);
      text.style.top = originTop + (viewH - inkH) / 2 + "px";
      placeCaret();
    }

    function approachAngle(from, to, amount) {
      let delta = (to - from) % 360;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      return from + delta * amount;
    }

    function screenAngle() {
      if (typeof window.orientation === "number") return window.orientation;
      if (screen.orientation && typeof screen.orientation.angle === "number") {
        return screen.orientation.angle;
      }
      return 0;
    }

    function screenAxes(beta, gamma) {
      const angle = screenAngle();
      if (angle === 90) return { lr: beta, fb: -gamma };
      if (angle === -90 || angle === 270) return { lr: -beta, fb: gamma };
      if (angle === 180) return { lr: -gamma, fb: -beta };
      return { lr: gamma, fb: beta };
    }

    function arealWeight(expo) {
      if (expo >= 0) return 400;
      return 400 + (-expo / 100) * 300;
    }

    function applyFace() {
      text.style.fontStyle = "normal";
      text.style.fontWeight = "normal";
      text.style.fontFamily = useAreal ? '"ABC Areal", sans-serif' : "Exposure, sans-serif";
      const lines = [...text.querySelectorAll(":scope > .line")];
      if (!lines.length) {
        text.style.fontVariationSettings = variationFor(lineExpo(0, 1), arealWeight(currentExpo));
        return;
      }
      lines.forEach((el, index) => {
        el.style.fontVariationSettings = variationFor(lineExpo(index, lines.length), lineWeight(index, lines.length));
      });
    }

    function mixHue(parts) {
      let x = 0;
      let y = 0;
      parts.forEach((part) => {
        if (part.w <= 0) return;
        const rad = part.hue * Math.PI / 180;
        x += Math.cos(rad) * part.w;
        y += Math.sin(rad) * part.w;
      });
      if (x === 0 && y === 0) return targetHue;
      return Math.atan2(y, x) * 180 / Math.PI;
    }

    function onOrientation(event) {
      if (event.beta == null || event.gamma == null) return;
      lastOrientation = { beta: event.beta, gamma: event.gamma };
      const axes = screenAxes(event.beta, event.gamma);
      targetSlant = clamp(axes.lr / ROLL, -1, 1) * MAX_SLANT;
      const pitch = Math.max(-180, Math.min(180, axes.fb));
      const travel = Math.sign(pitch) * Math.max(0, Math.abs(pitch) - DEAD);
      targetExpo = clamp(travel / PITCH, -1, 1) * FULL;
      const rollTravel = Math.sign(axes.lr) * Math.max(0, Math.abs(axes.lr) - DEAD);
      const xColor = clamp(rollTravel / 36, -1, 1);
      const yColor = clamp(travel / 36, -1, 1);
      const amount = Math.min(1, Math.hypot(xColor, yColor));
      tiltAmount = amount;
      targetSat = mode % 3 === 1 ? smoothstep(amount) : 0;
      if (amount > 0.001) {
        targetHue = mixHue([
          { w: Math.max(0, -yColor), hue: 25 },
          { w: Math.max(0, yColor), hue: 215 },
          { w: Math.max(0, -xColor), hue: 305 },
          { w: Math.max(0, xColor), hue: 125 },
        ]);
      }
    }

    function tick() {
      currentExpo += (targetExpo - currentExpo) * 0.18;
      if (Math.abs(targetExpo - currentExpo) < 0.04) currentExpo = targetExpo;
      currentSlant += (targetSlant - currentSlant) * 0.18;
      if (Math.abs(targetSlant - currentSlant) < 0.04) currentSlant = targetSlant;
      currentHue = approachAngle(currentHue, targetHue, 0.08);
      currentSat += (targetSat - currentSat) * 0.08;
      if (Math.abs(targetSat - currentSat) < 0.004) currentSat = targetSat;
      const strokeGoal = mode % 3 === 2 ? tiltAmount * STROKE_COUNT : 0;
      strokeLevel += (strokeGoal - strokeLevel) * 0.09;
      if (Math.abs(strokeGoal - strokeLevel) < 0.012) strokeLevel = strokeGoal;
      applyFace();
      paintStrokes();
      root.style.setProperty("--hue", currentHue.toFixed(2));
      root.style.setProperty("--sat", currentSat.toFixed(4));
      if (fontReady) fit();
      placeEditor();
      placeCaret();
      requestAnimationFrame(tick);
    }

    function strokeColor(index) {
      return "hsl(" + (currentHue + index * 36).toFixed(2) + ", 100%, 62%)";
    }

    function paintStrokes() {
      const size = parseFloat(text.style.fontSize) || 16;
      const step = size * STROKE_STEP;
      text.querySelectorAll(".ring").forEach((ring) => {
        const index = Number(ring.dataset.i);
        const grow = clamp(strokeLevel - index, 0, 1);
        const reach = step * Math.min(index + grow, strokeLevel);
        if (reach < 0.35) {
          ring.style.webkitTextStroke = "0px transparent";
          return;
        }
        ring.style.webkitTextStroke = (reach * 2).toFixed(2) + "px " + strokeColor(index);
      });
    }

    function listen() {
      if (listening) return;
      listening = true;
      window.addEventListener("deviceorientation", onOrientation);
    }

    function arm() {
      const needsGesture = window.DeviceOrientationEvent
        && typeof DeviceOrientationEvent.requestPermission === "function";
      if (!needsGesture) {
        listen();
        return;
      }
      enable.hidden = false;
      enable.addEventListener("click", () => {
        DeviceOrientationEvent.requestPermission()
          .then((state) => {
            if (state === "granted") {
              enable.hidden = true;
              listen();
            }
          })
          .catch(() => {});
      });
    }

    function readEditor() {
      const value = editor.value.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      if (value !== editor.value) {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = value;
        editor.selectionStart = start;
        editor.selectionEnd = end;
      }
      sourceText = value;
      fittedKey = "";
      fit();
    }

    editor.addEventListener("input", readEditor);
    editor.addEventListener("blur", () => {
      keyboardSeen = false;
      caret.hidden = true;
    });

    function syncKeyboard() {
      const typing = document.activeElement === editor;
      if (typing && keyboardSeen && keyboardInset() <= 140 && window.matchMedia("(pointer: coarse)").matches) {
        keyboardSeen = false;
        caret.hidden = true;
        editor.blur();
        return;
      }
      placeCaret();
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncKeyboard);
      window.visualViewport.addEventListener("scroll", syncKeyboard);
    }
    window.addEventListener("orientationchange", () => {
      if (keyboardInset() <= 140) screenTall = 0;
    });

    let tapStart = null;

    document.addEventListener("pointerdown", (event) => {
      if (event.target === enable) return;
      tapStart = {
        x: event.clientX,
        y: event.clientY,
        id: event.pointerId,
        typing: document.activeElement === editor,
      };
      if (overText(event.clientX, event.clientY)) editor.focus({ preventScroll: true });
    }, true);

    document.addEventListener("pointerup", (event) => {
      if (!tapStart || event.pointerId !== tapStart.id || event.target === enable) {
        tapStart = null;
        return;
      }
      const dx = event.clientX - tapStart.x;
      const dy = event.clientY - tapStart.y;
      const point = tapStart;
      tapStart = null;
      if (dx * dx + dy * dy > 144) return;
      if (overText(point.x, point.y)) {
        placeCaretFromPoint(point.x, point.y);
        editor.focus({ preventScroll: true });
        placeCaret();
        return;
      }
      mode = (mode + 1) % 6;
      useAreal = mode >= 3;
      if (lastOrientation) onOrientation(lastOrientation);
      else if (mode % 3 !== 1) targetSat = 0;
      fittedKey = "";
      applyFace();
      fit();
      if (point.typing) editor.focus({ preventScroll: true });
    }, true);

    document.addEventListener("selectionchange", () => {
      if (document.activeElement === editor) placeCaret();
    });

    document.fonts.ready.then(() => {
      fontReady = true;
      fit();
    });
    tick();
    arm();
  </script>
</body>
</html>
